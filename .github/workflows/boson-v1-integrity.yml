name: Boson Integrity

on:
  push:
    branches:
      - main
      - "astra/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    name: V1 frozen + V2 high precision / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Protect frozen V1
        run: python -m unittest -v test_reproduce.py

      - name: Verify exact V2 chain
        run: python -m unittest -v test_reproduce_v2.py

      - name: Reproduce V1
        run: python calculs/reproduce.py

      - name: Reproduce V2
        run: python calculs/reproduce_v2.py

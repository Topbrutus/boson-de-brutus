name: Boson V1 Integrity

on:
  push:
    branches:
      - main
      - "astra/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-v1:
    name: Frozen V1 / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run frozen V1 unit tests
        run: python -m unittest -v test_reproduce.py

      - name: Run canonical reproduction script
        run: python calculs/reproduce.py
